events {events {

    worker_connections 1024;    worker_connections 1024;

}}



http {http {

    # Define upstream servers (your 2 replicas)    upstream royalxpay_backend {

    upstream royalxpay_backend {        # Round-robin load balancing between two replicas

        server royalxpay-app-1:80;        server royalxpay-app-1:80;

        server royalxpay-app-2:80;        server royalxpay-app-2:80;

    }    }



    server {    server {

        listen 80;        listen 80;

        server_name localhost;        server_name localhost;



        # Pass requests to the backend        location / {

        location / {            proxy_pass http://royalxpay_backend;

            proxy_pass http://royalxpay_backend;            proxy_set_header Host $host;

            proxy_set_header Host $host;            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Real-IP $remote_addr;            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-Proto $scheme;            

                        # Timeouts

            # Timeout settings            proxy_connect_timeout 60s;

            proxy_connect_timeout 60s;            proxy_send_timeout 60s;

            proxy_send_timeout 60s;            proxy_read_timeout 60s;

            proxy_read_timeout 60s;        }

        }

        # Health check endpoint

        # Health check endpoint        location /health {

        location /health {            access_log off;

            access_log off;            return 200 "healthy\n";

            return 200 "healthy\n";            add_header Content-Type text/plain;

            add_header Content-Type text/plain;        }

        }    }

    }}

}
